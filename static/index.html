<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Auto Learn</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    :root { color-scheme: light; --bg:#f6f7f9; --panel:#fff; --text:#20242a; --muted:#657080; --line:#dfe4ea; --brand:#1f7a65; --brand-soft:#e9f7f2; --danger:#b42318; --blue:#2563eb; --amber:#b7791f; }
    * { box-sizing: border-box; }
    body { margin:0; overflow-x:hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background:var(--bg); color:var(--text); }
    header { height:64px; display:flex; align-items:center; justify-content:space-between; padding:0 28px; border-bottom:1px solid var(--line); background:#fff; }
    h1 { font-size:20px; margin:0; letter-spacing:0; }
    main { max-width:1180px; margin:0 auto; padding:24px; display:grid; grid-template-columns: 380px 1fr; gap:20px; }
    section { min-width:0; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:18px; }
    h2 { font-size:15px; margin:0 0 14px; }
    label { display:block; font-size:13px; color:var(--muted); margin:12px 0 6px; }
    select, input { width:100%; min-height:38px; border:1px solid var(--line); border-radius:6px; padding:8px 10px; font-size:14px; background:#fff; }
    input[type="checkbox"] { width:auto; min-height:0; }
    .row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .check { display:flex; gap:8px; align-items:center; margin-top:12px; color:var(--text); font-size:14px; }
    button { border:1px solid transparent; border-radius:6px; padding:9px 12px; font-size:14px; cursor:pointer; background:var(--brand); color:#fff; transition:background-color .16s ease, border-color .16s ease, color .16s ease, box-shadow .16s ease, transform .12s ease; }
    button:not(.secondary):not(.danger):not(.filter-button):hover:not(:disabled) { background:#17614f; color:#fff; box-shadow:0 2px 8px rgba(31,122,101,.18); transform:translateY(-1px); }
    button:active:not(:disabled) { transform:translateY(0); box-shadow:0 1px 4px rgba(31,122,101,.16); }
    button:focus-visible { outline:none; box-shadow:0 0 0 3px rgba(31,122,101,.18); }
    button.secondary { background:#fff; color:var(--text); border-color:var(--line); }
    button.secondary:hover:not(:disabled) { background:#f7fbf9; color:var(--text); border-color:#b9dfd2; box-shadow:0 2px 8px rgba(32,36,42,.06); transform:translateY(-1px); }
    button.danger { background:var(--danger); }
    button.danger:hover:not(:disabled) { background:#941b13; color:#fff; box-shadow:0 2px 8px rgba(180,35,24,.18); transform:translateY(-1px); }
    button:disabled { opacity:.55; cursor:not-allowed; }
    .actions { display:flex; gap:10px; margin-top:16px; flex-wrap:wrap; }
    .status { min-width:0; display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:12px; }
    .pill { border:1px solid var(--line); border-radius:999px; padding:4px 10px; font-size:12px; color:var(--muted); background:#fafafa; }
    .state-pill { font-weight:600; transition:background-color .2s ease, border-color .2s ease, color .2s ease, box-shadow .2s ease; }
    .state-pill.running { color:#17614f; border-color:#b9dfd2; background:#eef8f4; }
    .state-pill.stopping { color:#8a5a12; border-color:#f1d39b; background:linear-gradient(90deg, #fff8e8 0%, #fff 50%, #fff8e8 100%); background-size:200% 100%; animation:statusFlow 1.8s linear infinite; }
    .state-pill.success { color:#17614f; border-color:#b9dfd2; background:#eef8f4; }
    .state-pill.failed { color:var(--danger); border-color:#f0b8b2; background:#fff1f0; }
    .state-pill.incomplete { color:#8a5a12; border-color:#f1d39b; background:#fff8e8; }
    .state-pill.stopped { color:#6b7280; border-color:#d8dde5; background:#f7f8fa; }
    .job-list { display:grid; gap:8px; margin-bottom:12px; }
    .student-name { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:650; color:var(--text); }
    .job-meta { color:var(--muted); font-size:12px; margin-top:2px; }
    .detail { position:relative; min-width:0; display:grid; grid-template-columns:64px minmax(0, 1fr); column-gap:6px; row-gap:7px; border:1px solid var(--line); border-radius:6px; padding:12px; margin-bottom:12px; background:#fff; font-size:13px; line-height:1.45; }
    .detail.running { border-color:#b9dfd2; background:#f3fbf8; }
    .detail.success { border-color:#b9dfd2; background:#f3fbf8; }
    .detail.failed { border-color:#f0b8b2; background:#fff6f5; }
    .detail.incomplete { border-color:#f1d39b; background:#fffaf0; }
    .detail.stopped, .detail.idle { background:#fafafa; }
    .detail.has-pulse { padding-right:82px; }
    .detail > span:nth-child(odd) { color:var(--muted); white-space:nowrap; }
    .detail > span:nth-child(even) { min-width:0; overflow:visible; white-space:normal; overflow-wrap:anywhere; word-break:break-word; }
    .status-pulse { position:absolute; top:8px; right:12px; width:44px; height:44px; border-radius:50%; background:conic-gradient(from -90deg, var(--brand) var(--pulse-deg), #dfe9e6 0deg); display:grid; place-items:center; }
    .status-pulse::after { content:""; position:absolute; inset:5px; border-radius:inherit; background:#fff; }
    .pulse-inner { position:relative; z-index:1; display:grid; justify-items:center; color:#174f43; font-variant-numeric:tabular-nums; }
    .pulse-value { font-size:11px; font-weight:700; line-height:1; }
    .progress-rings { position:relative; width:32px; height:32px; display:grid; place-items:center; flex:0 0 auto; color:#174f43; }
    .progress-rings svg { width:100%; height:100%; overflow:visible; }
    .progress-rings circle { fill:none; }
    .progress-rings path { fill:none; stroke-linecap:round; }
    .progress-rings .ring-track-outer { stroke:#d7e8e2; stroke-width:4.45; }
    .progress-rings .ring-track-inner { stroke:#d7e9f7; stroke-width:4.45; }
    .progress-rings .ring-track-wait { stroke:#f2e6cf; stroke-width:3.45; }
    .progress-rings .ring-course { stroke:#1f7a65; stroke-width:4.45; transition:stroke-dashoffset .45s ease; }
    .progress-rings .ring-chapter { stroke:#2f83cc; stroke-width:4.45; transition:stroke-dashoffset .45s ease; }
    .progress-rings .ring-wait { stroke:#c58a2b; stroke-width:3.45; transition:stroke-dashoffset .45s ease; }
    .progress-rings .ring-label { display:none; position:absolute; inset:0; place-items:center; font-size:11px; font-weight:700; font-variant-numeric:tabular-nums; }
    .progress-rings.detail-ring { position:absolute; top:8px; right:12px; width:60px; height:60px; border-radius:50%; background:transparent; box-shadow:none; overflow:visible; }
    .progress-rings.detail-ring svg { position:relative; z-index:1; }
    .student-panel { margin-bottom:16px; }
    .student-panel summary { min-height:38px; display:flex; align-items:center; justify-content:space-between; gap:12px; cursor:pointer; list-style:none; }
    .student-panel summary::-webkit-details-marker { display:none; }
    .student-panel summary h2 { margin:0; }
    .student-panel summary::after { content:""; width:8px; height:8px; border-right:1.5px solid var(--muted); border-bottom:1.5px solid var(--muted); transform:rotate(45deg); transition:transform .18s ease; margin-right:4px; }
    .student-panel[open] summary::after { transform:rotate(225deg); }
    .student-panel .pill { margin-left:auto; }
    .student-filters { display:flex; gap:6px; flex-wrap:wrap; margin:8px 0 10px; }
    .filter-button { min-height:30px; padding:5px 9px; border-color:var(--line); border-radius:999px; background:#fff; color:var(--muted); font-size:12px; line-height:1.2; }
    .filter-button:hover { border-color:#bfd7ce; color:#17614f; background:#f7fbf9; }
    .filter-button.active { border-color:#9ccbbb; color:#17614f; background:#eaf6f2; font-weight:650; }
    .student-table-wrap { max-height:320px; overflow:auto; border:1px solid var(--line); border-radius:6px; background:#fff; margin-top:8px; }
    .student-table { width:100%; border-collapse:collapse; table-layout:fixed; font-size:13px; }
    .student-table th { position:sticky; top:0; z-index:1; background:#f8fafb; color:var(--muted); font-size:12px; font-weight:650; text-align:left; padding:7px 8px; border-bottom:1px solid var(--line); }
    .student-table td { padding:7px 8px; border-bottom:1px solid #edf0f3; vertical-align:middle; }
    .student-table tr:last-child td { border-bottom:0; }
    .student-table tbody tr { cursor:pointer; }
    .student-table tbody tr:hover { background:#f7fbf9; }
    .student-table tbody tr.active { background:transparent; }
    .student-table tbody tr.active:hover { background:#f7fbf9; }
    .student-table tbody tr.active td:first-child { position:relative; }
    .student-table tbody tr.active td:first-child::before { content:""; position:absolute; left:0; top:7px; bottom:7px; width:3px; border-radius:0 999px 999px 0; background:var(--brand); }
    .student-table tbody tr.failed td, .student-table tbody tr.incomplete td { background:#fffaf0; }
    .student-table tbody tr.success, .student-table tbody tr.stopped, .student-table tbody tr.idle { opacity:.78; }
    .student-table .student-name { display:block; }
    .student-table .name-col { width:74px; }
    .student-table .status-col { width:92px; }
    .student-table .stage-col { width:auto; }
    .student-table .progress-col { width:56px; text-align:center; }
    .student-table .stage-text { display:block; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--muted); }
    .student-table .state-pill { white-space:nowrap; }
    .student-table td:last-child { text-align:center; }
    .student-table .progress-rings { margin-left:auto; margin-right:auto; }
    .add-student-module { margin-top:22px; padding-top:18px; border-top:1px solid var(--line); }
    .add-student-module h2 { margin-bottom:12px; }
    .feedback { min-height:20px; margin-top:8px; font-size:12px; line-height:1.5; color:var(--muted); }
    .feedback.success { color:var(--brand); }
    .feedback.error { color:var(--danger); }
    pre { max-width:100%; height:620px; margin:0; overflow:auto; background:#101418; color:#d7e0ea; border-radius:6px; padding:14px; font:12px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space:pre-wrap; overflow-wrap:anywhere; }
    .hint { font-size:12px; line-height:1.5; color:var(--muted); margin-top:8px; }
    details.auth-help { border:1px solid var(--line); border-radius:6px; padding:10px 12px; margin:8px 0 10px; background:#fafafa; overflow:hidden; }
    details.auth-help summary { cursor:pointer; font-size:13px; color:var(--text); }
    details.auth-help ol { margin:10px 0 0; padding-left:20px; color:var(--muted); font-size:12px; line-height:1.7; }
    details.auth-help li { min-width:0; overflow-wrap:anywhere; }
    details.auth-help code { color:var(--text); white-space:normal; overflow-wrap:anywhere; word-break:break-word; }
    @keyframes statusFlow { from { background-position:0% 0; } to { background-position:200% 0; } }
    @media (max-width: 900px) { main { grid-template-columns:minmax(0, 1fr); padding:14px; } header { padding:0 16px; } .detail { grid-template-columns:60px minmax(0, 1fr); } .detail.has-pulse { padding-right:78px; } pre { height:420px; } }
  </style>
</head>
<body>
  <header>
    <h1>自动学习控制台</h1>
    <span class="pill" id="clock"></span>
  </header>
  <main>
    <section>
      <select id="user" hidden></select>
      <details class="student-panel" open>
        <summary>
          <h2>学员列表</h2>
          <span class="pill" id="boardCount"></span>
        </summary>
        <div class="student-filters" id="studentFilters"></div>
        <div class="student-table-wrap" id="studentTableWrap">
          <table class="student-table">
            <thead>
              <tr>
                <th class="name-col">姓名</th>
                <th class="status-col">状态</th>
                <th class="stage-col">阶段</th>
                <th class="progress-col">进度</th>
              </tr>
            </thead>
            <tbody id="jobList"></tbody>
          </table>
        </div>
      </details>
      <div class="row">
        <div>
          <label>任务</label>
          <select id="action">
            <option value="learn">自动学习</option>
            <option value="add_course">添加课程</option>
            <option value="cancel_course">取消未开始课程</option>
          </select>
        </div>
        <div id="courseTypeField">
          <label>课程类型</label>
          <select id="courseType">
            <option value="">全部</option>
            <option value="CT2017110000000074">公需课</option>
            <option value="CT2017110000000075">知识更新工程专题</option>
          </select>
        </div>
      </div>
      <div class="row" id="addCourseFields">
        <div>
          <label>年份</label>
          <input id="year" type="number" min="2020">
        </div>
        <div>
          <label>目标学时</label>
          <input id="credit" type="number" min="0" step="0.5" value="30">
        </div>
      </div>
      <label>学习时间窗</label>
      <input id="windows" placeholder="例如 08:00-12:00,19:00-22:30">
      <div class="hint">留空表示立刻运行。跨天可写 22:00-01:00。</div>
      <label class="check"><input id="finishExam" type="checkbox" checked> 视频完成后自动收集题库并答题</label>
      <label class="check"><input id="keepSchedule" type="checkbox" checked> 不在学习时间内时保持等待，到点自动继续</label>
      <div class="actions">
        <button id="start">开始任务</button>
        <button class="danger" id="stop">停止任务</button>
        <button class="secondary" id="updateSchedule">更新时间窗</button>
        <button class="secondary" id="refreshUsers">刷新用户</button>
      </div>

      <div class="add-student-module">
        <h2>添加学员</h2>
        <details class="auth-help">
          <summary>如何获取 authCode</summary>
          <ol>
            <li>先进入 <code>https://rsj.nanjing.gov.cn/</code></li>
            <li>点击右上角的“用户登陆”，登陆后跳转到 <code>https://m.mynj.cn:11097/plateform/rediectIndex/goods?authCode=XXXXXXX</code></li>
            <li>复制 <code>authCode=</code> 后面所有的字符 <code>XXXXXXX</code></li>
            <li>在下面粘贴第 3 步复制下来的 <code>XXXXXXX</code></li>
          </ol>
        </details>
        <label>authCode</label>
        <input id="authCode" placeholder="粘贴登录跳转地址里的 authCode">
        <div class="actions">
          <button class="secondary" id="createUser">保存学员</button>
        </div>
        <div class="feedback" id="createUserStatus"></div>
      </div>
    </section>
    <section>
      <div class="status">
        <h2>当前学员状态</h2>
        <span class="pill" id="state">idle</span>
      </div>
      <div class="detail" id="jobDetail"></div>
      <pre id="logs"></pre>
    </section>
  </main>
<script>
const $ = (id) => document.getElementById(id);
const nowYear = new Date().getFullYear();
let latestJobs = [];
let selectedUserFile = "";
let studentFilter = "running";
let usersByFile = {};
let videoTickAnchors = {};
$("year").value = nowYear;

function updateActionFields() {
  const isAddCourse = $("action").value === "add_course";
  $("courseTypeField").style.display = isAddCourse ? "block" : "none";
  $("addCourseFields").style.display = isAddCourse ? "grid" : "none";
}

async function requestJson(url, options = {}) {
  const res = await fetch(url, {headers: {"Content-Type":"application/json"}, ...options});
  const data = await res.json();
  if (!res.ok) throw new Error(data.detail || "请求失败");
  return data;
}

async function loadUsers() {
  const data = await requestJson("/api/users");
  usersByFile = Object.fromEntries((data.users || []).map(user => [user.file, user]));
  $("user").innerHTML = data.users.map(u => `<option value="${u.file}">${u.username}</option>`).join("");
  if (!data.users.length) $("user").innerHTML = `<option value="">暂无学员</option>`;
  if (selectedUserFile) $("user").value = selectedUserFile;
  applySelectedSchedule();
}

async function pollState() {
  try {
    const state = await requestJson("/api/state");
    latestJobs = state.jobs || [];
    renderJobs();
  } catch (err) {
    $("state").textContent = err.message;
  }
}

function selectedJob() {
  if (!selectedUserFile) return null;
  return latestJobs.find(job => job.user_file === selectedUserFile) || null;
}

function selectedUserConfig() {
  return usersByFile[selectedUserFile] || null;
}

function studentRows() {
  const rowsByFile = {};
  Object.values(usersByFile).forEach(user => {
    rowsByFile[user.file] = {user_file: user.file, username: user.username || user.file, config: user, job: null};
  });
  latestJobs.forEach(job => {
    rowsByFile[job.user_file] = {
      ...(rowsByFile[job.user_file] || {}),
      user_file: job.user_file,
      username: job.username || rowsByFile[job.user_file]?.username || job.user_file,
      config: rowsByFile[job.user_file]?.config || null,
      job
    };
  });
  return Object.values(rowsByFile).sort((a, b) => {
    const priorityA = studentPriority(a);
    const priorityB = studentPriority(b);
    if (priorityA !== priorityB) return priorityA - priorityB;
    const timeA = a.job?.started_at || a.job?.ended_at || "";
    const timeB = b.job?.started_at || b.job?.ended_at || "";
    if (timeA !== timeB) return timeB.localeCompare(timeA);
    return String(a.username || "").localeCompare(String(b.username || ""), "zh-Hans-CN");
  });
}

function studentPriority(row) {
  const job = row.job;
  if (job?.running) return 0;
  if (job?.status === "failed" || job?.status === "incomplete") return 1;
  if (job?.status === "stopping") return 2;
  if (job?.status === "success" || job?.status === "stopped") return 3;
  return 4;
}

function studentFilterKey(row) {
  const job = row.job;
  if (job?.running) return "running";
  if (job?.status === "failed" || job?.status === "incomplete") return "attention";
  if (job?.status === "stopping") return "stopping";
  if (job?.status === "success" || job?.status === "stopped") return "done";
  return "idle";
}

const studentFilterLabels = {
  all: "全部",
  running: "运行中",
  done: "已结束",
  idle: "暂无"
};

function filteredStudentRows(rows) {
  if (studentFilter === "all") return rows;
  return rows.filter(row => studentFilterKey(row) === studentFilter);
}

function renderStudentFilters(rows) {
  const counts = rows.reduce((acc, row) => {
    const key = studentFilterKey(row);
    acc[key] = (acc[key] || 0) + 1;
    return acc;
  }, {all: rows.length});
  const filters = ["all", "running", "done", "idle"];
  $("studentFilters").innerHTML = filters.map(key => `
    <button type="button" class="filter-button ${studentFilter === key ? "active" : ""}" data-filter="${key}">
      ${studentFilterLabels[key]} ${counts[key] || 0}
    </button>
  `).join("");
  $("studentFilters").querySelectorAll("button[data-filter]").forEach(button => {
    button.onclick = () => {
      studentFilter = button.dataset.filter;
      renderJobs();
    };
  });
}

function applySelectedSchedule() {
  if (document.activeElement === $("windows")) return;
  if (!selectedUserFile) {
    $("windows").value = "";
    $("keepSchedule").checked = true;
    return;
  }
  const formUserFile = selectedUserFile;
  const job = latestJobs.find(item => item.user_file === formUserFile) || null;
  const config = job || usersByFile[formUserFile] || null;
  $("windows").value = config?.study_windows || "";
  $("keepSchedule").checked = config?.keep_schedule !== false;
}

function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, (char) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[char]));
}

function actionText(action) {
  return {learn: "自动学习", add_course: "添加课程", cancel_course: "取消课程"}[action] || action || "-";
}

function taskModeText(job) {
  if (!job) return "-";
  if (job.action === "learn") return job.finish_exam ? "自动学习（视频+答题）" : "自动学习（仅视频）";
  return actionText(job.action);
}

function jobStateClass(job) {
  if (!job) return "";
  if (job.running) return "running";
  return {
    success: "success",
    failed: "failed",
    incomplete: "incomplete",
    stopped: "stopped",
    stopping: "stopping"
  }[job.status] || "";
}

function jobStateText(job) {
  if (!job) return "暂无任务";
  return job.running ? "运行中" : (job.status || "-");
}

function setDetailState(job, hasIndicator) {
  const detail = $("jobDetail");
  detail.className = `detail ${hasIndicator ? "has-pulse" : ""} ${jobStateClass(job) || (!job ? "idle" : "")}`.trim();
}

function progressText(job) {
  if (!job) return "-";
  if (job.total_courses > 0 && job.course_index > 0) return `${job.course_index}/${job.total_courses}`;
  if (job.total_courses > 0) return `0/${job.total_courses}`;
  return "-";
}

function chapterProgressText(job) {
  if (!job) return "-";
  const indexText = job.total_chapters > 0 && job.chapter_index > 0 ? `${job.chapter_index}/${job.total_chapters}` : "-";
  const percentText = job.chapter_progress > 0 ? `${job.chapter_progress}%` : "";
  return percentText ? `${indexText} · ${percentText}` : indexText;
}

function clampPercent(value) {
  return Math.max(0, Math.min(100, Number(value || 0)));
}

function courseProgressPercent(job) {
  if (!job || job.total_courses <= 0) return 0;
  const completedCourses = Math.max(0, Number(job.course_index || 0) - 1);
  let currentCourseProgress = 0;
  if (job.total_chapters > 0 && job.chapter_index > 0) {
    const completedChapters = Math.max(0, Number(job.chapter_index || 0) - 1);
    currentCourseProgress = (completedChapters + clampPercent(job.chapter_progress) / 100) / job.total_chapters;
  }
  return clampPercent(((completedCourses + currentCourseProgress) / job.total_courses) * 100);
}

function ringArcPath(cx, cy, radius, percent) {
  const value = clampPercent(percent);
  if (value <= 0) return "";
  const endAngle = (value / 100) * 360 - 90;
  const endRadians = endAngle * Math.PI / 180;
  const startX = cx;
  const startY = cy - radius;
  const endX = cx + radius * Math.cos(endRadians);
  const endY = cy + radius * Math.sin(endRadians);
  const largeArc = value > 50 ? 1 : 0;
  if (value >= 99.9) {
    return `M ${cx} ${cy - radius} A ${radius} ${radius} 0 1 1 ${cx - 0.01} ${cy - radius}`;
  }
  return `M ${startX} ${startY} A ${radius} ${radius} 0 ${largeArc} 1 ${endX} ${endY}`;
}

function dualRingHtml(job, className = "") {
  if (!job || !job.running || job.current_step !== "观看视频") return "";
  const coursePercent = courseProgressPercent(job);
  const chapterPercent = clampPercent(job.chapter_progress);
  const tick = videoTickRemaining(job);
  const waitPercent = clampPercent((1 - tick / 30) * 100);
  const title = `课程 ${Math.round(coursePercent)}%，章节 ${Math.round(chapterPercent)}%，下次检查 ${tick}s`;
  const outerRadius = 12.4;
  const innerRadius = 7.25;
  const waitRadius = 2.9;
  const coursePath = ringArcPath(16, 16, outerRadius, coursePercent);
  const chapterPath = ringArcPath(16, 16, innerRadius, chapterPercent);
  const waitPath = ringArcPath(16, 16, waitRadius, waitPercent);
  return `
    <div class="progress-rings ${className}" data-user-file="${escapeHtml(job.user_file)}" title="${escapeHtml(title)}">
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <circle class="ring-track-outer" cx="16" cy="16" r="${outerRadius}"></circle>
        ${coursePath ? `<path class="ring-course" d="${coursePath}"></path>` : ""}
        <circle class="ring-track-inner" cx="16" cy="16" r="${innerRadius}"></circle>
        ${chapterPath ? `<path class="ring-chapter" d="${chapterPath}"></path>` : ""}
        <circle class="ring-track-wait" cx="16" cy="16" r="${waitRadius}"></circle>
        ${waitPath ? `<path class="ring-wait" d="${waitPath}"></path>` : ""}
      </svg>
      <span class="ring-label">${escapeHtml(Math.round(chapterPercent))}%</span>
    </div>
  `;
}

function waitRemainingSeconds(job) {
  if (!job || job.current_step !== "等待学习时间" || !job.running) return 0;
  if (job.wait_until_at) return Math.max(0, Math.ceil(job.wait_until_at - Date.now() / 1000));
  return Math.max(0, Number(job.wait_remaining_seconds || 0));
}

function formatDuration(totalSeconds) {
  const seconds = Math.max(0, Math.floor(totalSeconds));
  const hours = Math.floor(seconds / 3600);
  const minutes = Math.floor((seconds % 3600) / 60);
  const secs = seconds % 60;
  if (hours > 0) return `${hours}:${String(minutes).padStart(2, "0")}:${String(secs).padStart(2, "0")}`;
  return `${minutes}:${String(secs).padStart(2, "0")}`;
}

function formatPulseDuration(totalSeconds) {
  const seconds = Math.max(0, Math.floor(totalSeconds));
  if (seconds >= 3600) return `${Math.ceil(seconds / 3600)}h`;
  if (seconds >= 60) return `${Math.ceil(seconds / 60)}m`;
  return `${seconds}s`;
}

function videoTickRemaining(job) {
  const key = `${job?.id || job?.user_file || "job"}:${job?.chapter_index || 0}:${job?.chapter_progress || 0}`;
  const updatedAt = Number(job?.chapter_progress_updated_at || 0);
  const now = Date.now() / 1000;
  if (!updatedAt && !videoTickAnchors[key]) videoTickAnchors[key] = now;
  const startedAt = updatedAt || videoTickAnchors[key] || now;
  const elapsed = Math.floor(now - startedAt);
  return Math.max(0, 30 - (elapsed % 30));
}

function statusPulseState(job) {
  if (!job || !job.running) return null;
  const waitingSeconds = waitRemainingSeconds(job);
  if (job.current_step === "等待学习时间" && waitingSeconds > 0) {
    const total = Math.max(waitingSeconds, Number(job.wait_total_seconds || 0), 1);
    return {
      value: formatPulseDuration(waitingSeconds),
      degree: Math.round((1 - waitingSeconds / total) * 360),
      title: formatDuration(waitingSeconds)
    };
  }

  if (job.current_step === "观看视频") {
    const tick = videoTickRemaining(job);
    return {
      value: `${tick}s`,
      degree: Math.round((tick / 30) * 360),
      title: `${tick}s`
    };
  }

  return null;
}

function statusPulseHtml(job) {
  const state = statusPulseState(job);
  if (!state) return "";
  const degree = Math.max(0, Math.min(360, state.degree));
  return `
    <div class="status-pulse" style="--pulse-deg:${degree}deg" title="${escapeHtml(state.title)}">
      <div class="pulse-inner">
        <div class="pulse-value">${escapeHtml(state.value)}</div>
      </div>
    </div>
  `;
}

function updateStatusPulse(job) {
  const pulse = $("jobDetail").querySelector(".status-pulse");
  const state = statusPulseState(job);
  if (!pulse || !state) return;
  const degree = Math.max(0, Math.min(360, state.degree));
  pulse.style.setProperty("--pulse-deg", `${degree}deg`);
  pulse.title = state.title;
  const value = pulse.querySelector(".pulse-value");
  if (value) value.textContent = state.value;
}

function updateLiveIndicators() {
  document.querySelectorAll(".progress-rings[data-user-file]").forEach(ring => {
    const job = latestJobs.find(item => item.user_file === ring.dataset.userFile);
    if (!job) return;
    const next = dualRingHtml(job, ring.classList.contains("detail-ring") ? "detail-ring" : "");
    if (next) ring.outerHTML = next;
  });
  updateStatusPulse(selectedJob());
}

function studentBoardRowHtml(row) {
  const rowClass = row.job ? jobStateClass(row.job) : "idle";
  return `
    <tr class="${rowClass} ${row.user_file === selectedUserFile ? "active" : ""}" data-user-file="${escapeHtml(row.user_file)}">
      <td><span class="student-name">${escapeHtml(row.username || row.user_file)}</span></td>
      <td><span class="pill state-pill ${jobStateClass(row.job)}">${escapeHtml(jobStateText(row.job))}</span></td>
      <td><span class="stage-text">${escapeHtml(rowStageText(row))}</span></td>
      <td>${dualRingHtml(row.job) || ""}</td>
    </tr>
  `;
}

function rowStageText(row) {
  const job = row.job;
  if (!job) return "-";
  if (job.running) return job.current_step || "运行中";
  if (job.status === "success") return "已完成";
  if (job.status === "stopped") return "已停止";
  return job.current_step || job.message || job.status || "-";
}

function renderStudentBoard(rows) {
  const visibleRows = filteredStudentRows(rows);
  $("jobList").innerHTML = visibleRows.map(row => studentBoardRowHtml(row)).join("");
  if (!rows.length) {
    $("jobList").innerHTML = `<tr><td colspan="4" class="hint">暂无学员。不同学员可以同时运行，同一学员只能运行一个任务。</td></tr>`;
  } else if (!visibleRows.length) {
    $("jobList").innerHTML = `<tr><td colspan="4" class="hint">当前筛选下暂无学员。</td></tr>`;
  }
  $("jobList").querySelectorAll("tr[data-user-file]").forEach(item => {
    item.onclick = () => {
      selectedUserFile = item.dataset.userFile;
      $("user").value = selectedUserFile;
      applySelectedSchedule();
      renderJobs();
    };
  });
}

function renderJobs() {
  const rows = studentRows();
  const visibleRows = filteredStudentRows(rows);
  const selectedRow = selectedUserFile ? rows.find(row => row.user_file === selectedUserFile) || null : null;
  const job = selectedRow?.job || null;
  const formJob = selectedUserFile ? latestJobs.find(item => item.user_file === selectedUserFile) || null : null;
  const formRunning = Boolean(formJob && formJob.running);
  const runningCount = latestJobs.filter(item => item.running).length;
  renderStudentFilters(rows);
  $("boardCount").textContent = studentFilter === "all"
    ? (runningCount > 0 ? `${runningCount}/${rows.length} 运行中` : `${rows.length} 名学员`)
    : `${visibleRows.length}/${rows.length} ${studentFilterLabels[studentFilter]}`;
  renderStudentBoard(rows);
  $("logs").textContent = job ? job.logs.join("\n") : "";
  $("logs").scrollTop = $("logs").scrollHeight;
  $("start").disabled = formRunning || !selectedUserFile;
  $("stop").disabled = !formRunning || !selectedUserFile;
  $("updateSchedule").disabled = !selectedUserFile;

  if (!selectedRow) {
    $("state").textContent = "请选择学员";
    $("state").className = "pill";
    setDetailState(null, false);
    $("jobDetail").innerHTML = `
      <span>学员</span><span>未选择</span>
      <span>阶段</span><span>从左侧学员列表点击一个名字查看详情</span>
      <span>课程</span><span>-</span>
      <span>时间窗</span><span>${escapeHtml(usersByFile[selectedUserFile]?.study_windows || "全天")}</span>
    `;
    if (runningCount > 0) $("clock").textContent = `${new Date().toLocaleString()} · ${runningCount} 个任务运行中`;
    return;
  }

  const selectedName = selectedRow.username || selectedUserFile || "未选择";
  $("state").textContent = job ? `${job.username || job.user_file} · ${job.current_step || job.status}`.trim() : `${selectedName} · 暂无任务`;
  $("state").className = `pill state-pill ${jobStateClass(job)}`;
  const detailIndicatorHtml = dualRingHtml(job, "detail-ring") || statusPulseHtml(job);
  setDetailState(job, Boolean(detailIndicatorHtml));
  $("jobDetail").innerHTML = job ? `
    <span>学员</span><span>${escapeHtml(job.username || job.user_file)}</span>
    <span>任务</span><span>${escapeHtml(taskModeText(job))}</span>
    <span>阶段</span><span>${escapeHtml(job.current_step || job.message || job.status || "-")}</span>
    <span>课程</span><span title="${escapeHtml(job.current_course || "")}">${escapeHtml(progressText(job))} · ${escapeHtml(job.current_course || "尚未进入课程")}</span>
    <span>章节</span><span title="${escapeHtml(job.current_chapter || "")}">${escapeHtml(chapterProgressText(job))} · ${escapeHtml(job.current_chapter || "尚未进入章节")}</span>
    <span>时间窗</span><span>${escapeHtml(job.study_windows || "全天")}</span>
    <span>状态</span><span>${escapeHtml(job.message || job.status || "-")}</span>
    ${detailIndicatorHtml}
  ` : `
    <span>学员</span><span>${escapeHtml(selectedName)}</span>
    <span>阶段</span><span>暂无任务</span>
    <span>课程</span><span>尚未开始</span>
    <span>时间窗</span><span>${escapeHtml(selectedUserConfig()?.study_windows || "全天")}</span>
  `;
  if (runningCount > 0) $("clock").textContent = `${new Date().toLocaleString()} · ${runningCount} 个任务运行中`;
}

async function startSelectedJob() {
  try {
    if (!selectedUserFile) return;
    await requestJson("/api/jobs", {
      method: "POST",
      body: JSON.stringify({
        action: $("action").value,
        user_file: selectedUserFile,
        finish_exam: $("finishExam").checked,
        study_windows: $("windows").value,
        keep_schedule: $("keepSchedule").checked,
        course_type: $("courseType").value,
        year: Number($("year").value || nowYear),
        credit: Number($("credit").value || 30)
      })
    });
    await pollState();
  } catch (err) { alert(err.message); }
}

async function stopSelectedJob() {
  if (!selectedUserFile) return;
  await requestJson("/api/jobs/stop", {method:"POST", body: JSON.stringify({user_file: selectedUserFile})});
  await pollState();
}

$("start").onclick = startSelectedJob;
$("stop").onclick = stopSelectedJob;
$("updateSchedule").onclick = async () => {
  if (!selectedUserFile) return;
  try {
    await requestJson("/api/jobs/schedule", {
      method: "POST",
      body: JSON.stringify({
        user_file: selectedUserFile,
        study_windows: $("windows").value,
        keep_schedule: $("keepSchedule").checked
      })
    });
    await loadUsers();
    await pollState();
  } catch (err) { alert(err.message); }
};
$("refreshUsers").onclick = async () => {
  await loadUsers();
  renderJobs();
};
$("user").onchange = () => {
  selectedUserFile = $("user").value;
  applySelectedSchedule();
  renderJobs();
};
$("action").onchange = updateActionFields;
$("createUser").onclick = async () => {
  const authCode = $("authCode").value.trim();
  const button = $("createUser");
  const status = $("createUserStatus");
  if (!authCode) {
    status.textContent = "请输入 authCode。";
    status.className = "feedback error";
    return;
  }
  button.disabled = true;
  button.textContent = "保存中...";
  status.textContent = "正在验证 authCode 并创建学员，请稍候。";
  status.className = "feedback";
  try {
    const created = await requestJson("/api/users", {method:"POST", body: JSON.stringify({auth_code: authCode})});
    $("authCode").value = "";
    selectedUserFile = created.file;
    await loadUsers();
    renderJobs();
    status.textContent = `学员 ${created.username || created.file} 已保存并选中。`;
    status.className = "feedback success";
  } catch (err) {
    status.textContent = err.message;
    status.className = "feedback error";
  } finally {
    button.disabled = false;
    button.textContent = "保存学员";
  }
};

setInterval(() => {
  const runningCount = latestJobs.filter(item => item.running).length;
  $("clock").textContent = runningCount > 0 ? `${new Date().toLocaleString()} · ${runningCount} 个任务运行中` : new Date().toLocaleString();
  updateLiveIndicators();
}, 1000);
setInterval(pollState, 2500);
async function initPage() {
  updateActionFields();
  await loadUsers();
  await pollState();
}
initPage();
</script>
</body>
</html>
