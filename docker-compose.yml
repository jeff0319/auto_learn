services:
  auto-learn-web:
    build: .
    container_name: auto-learn-web
    restart: unless-stopped
    ports:
      - "28000:28000"
    environment:
      TZ: Asia/Shanghai
      PORT: "28000"
      AUTO_LEARN_MAX_LOG_LINES: "1200"
    command: uvicorn app:app --host 0.0.0.0 --port 28000 --reload
    volumes:
      - .:/app
